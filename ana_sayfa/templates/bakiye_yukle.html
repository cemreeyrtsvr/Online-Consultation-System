<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Bakiye Yükle | E-Sağlık Cüzdan</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --success: #2ecc71; --primary: #3498db; --dark: #2c3e50; }
        body {
            margin: 0; font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #e0f7fa 0%, #e8f5e9 100%);
            min-height: 100vh; display: flex; align-items: center; justify-content: center;
        }

        .wallet-card {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(20px);
            width: 100%; max-width: 420px; padding: 40px;
            border-radius: 30px; border: 1px solid rgba(255,255,255,0.5);
            box-shadow: 0 25px 50px rgba(0,0,0,0.05);
            text-align: center;
            animation: fadeIn 0.6s ease-out;
        }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        .icon-box {
            width: 70px; height: 70px; background: #e8f5e9; color: var(--success);
            border-radius: 20px; display: flex; align-items: center; justify-content: center;
            font-size: 30px; margin: 0 auto 20px;
        }

        h2 { margin: 0; color: var(--dark); font-size: 24px; }
        p { color: #7f8c8d; font-size: 14px; margin-bottom: 30px; }

        .input-group { text-align: left; margin-bottom: 20px; }
        label { display: block; font-size: 12px; font-weight: 800; color: #94a3b8; margin-bottom: 8px; text-transform: uppercase; }

        input {
            width: 100%; padding: 15px; border-radius: 15px; border: 2px solid #edf2f7;
            box-sizing: border-box; outline: none; transition: 0.3s; font-size: 16px;
        }
        input:focus { border-color: var(--success); background: #f0fff4; }

        .amount-input { font-size: 24px; font-weight: 800; text-align: center; color: var(--success); }

        .card-grid { display: grid; grid-template-columns: 2fr 1fr; gap: 10px; margin-top: 10px; }

        .btn-load {
            background: var(--success); color: white; border: none; width: 100%;
            padding: 20px; border-radius: 18px; font-size: 17px; font-weight: 800;
            cursor: pointer; transition: 0.3s; margin-top: 25px;
            box-shadow: 0 10px 20px rgba(46, 204, 113, 0.2);
        }
        .btn-load:hover { transform: translateY(-3px); box-shadow: 0 15px 30px rgba(46, 204, 113, 0.3); }

        .back-link { display: block; margin-top: 20px; color: #94a3b8; text-decoration: none; font-size: 14px; font-weight: 600; }
    </style>
</head>
<body>

<div class="wallet-card">
    <div class="icon-box">
        <i class="fas fa-wallet"></i>
    </div>
    <h2>Cüzdanına Bakiye Ekle</h2>
    <p>Yüklediğin bakiye ile anında randevu alabilirsin.</p>

    <form method="POST">
        {% csrf_token %}

        <div class="input-group">
            <label>Yüklenecek Tutar (TL)</label>
            <input type="number" name="miktar" class="amount-input" placeholder="0.00" required min="10">
        </div>

        <div class="input-group">
            <label>Kart Numarası</label>
            <input type="text" placeholder="**** **** **** ****" maxlength="19">
        </div>

        <div class="card-grid">
            <div class="input-group">
                <label>Son Kullanma</label>
                <input type="text" placeholder="AA/YY">
            </div>
            <div class="input-group">
                <label>CVV</label>
                <input type="password" placeholder="***">
            </div>
        </div>

        <button type="submit" class="btn-load">
            <i class="fas fa-check-circle"></i> Güvenli Yüklemeyi Başlat
        </button>

        <a href="{% url 'profil_sayfasi' %}" class="back-link">Vazgeç ve Profile Dön</a>
    </form>
</div>

</body>
</html>

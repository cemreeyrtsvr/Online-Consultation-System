<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Platforma Giriş</title>
    <style>
        /* --- ARKA PLAN GÜNCELLENDİ (Resim + Lacivert Filtre) --- */
        body {
            margin: 0;
            font-family: 'Segoe UI', sans-serif;
            /* Unsplash'ten profesyonel bir sağlık/teknoloji görseli */
            background: linear-gradient(rgba(44, 62, 80, 0.85), rgba(52, 152, 219, 0.85)), url('https://images.unsplash.com/photo-1576091160550-2173dba999ef?auto=format&fit=crop&w=2000&q=80');
            background-size: cover;
            background-position: center;
            background-attachment: fixed; /* Sayfa kaysa bile resim sabit kalır */
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh; /* Kesilmeleri önlemek için min-height */
            color: white;
            padding: 20px;
            box-sizing: border-box;
        }

        .container { text-align: center; max-width: 900px; padding: 20px; }
        h1 { font-size: 3.5rem; margin-bottom: 10px; text-shadow: 0 4px 10px rgba(0,0,0,0.3); }
        p.subtitle { font-size: 1.2rem; opacity: 0.95; margin-bottom: 50px; }

        .split-container { display: flex; gap: 40px; justify-content: center; flex-wrap: wrap; }

        .role-card {
            /* Kartların arka planı daha şeffaf yapıldı ki resim belli olsun */
            background: rgba(255, 255, 255, 0.15); width: 320px; padding: 50px 30px; border-radius: 20px;
            backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); /* Buzlu cam efekti güçlendirildi */
            border: 2px solid rgba(255,255,255,0.3);
            box-shadow: 0 20px 40px rgba(0,0,0,0.3); cursor: pointer; transition: 0.4s;
            text-decoration: none; color: white; display: flex; flex-direction: column; align-items: center;
        }

        .role-card:hover { transform: translateY(-15px); background: rgba(255, 255, 255, 0.25); border-color: #fff; box-shadow: 0 25px 50px rgba(52, 152, 219, 0.4); }

        .icon-circle {
            width: 100px; height: 100px; background: white; border-radius: 50%;
            display: flex; align-items: center; justify-content: center; font-size: 50px; margin-bottom: 25px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
        }

        .student-card .icon-circle { color: #3498db; }
        .client-card .icon-circle { color: #e74c3c; }

        h2 { margin: 0 0 15px 0; font-size: 28px; font-weight: 700; }
        p { margin: 0; opacity: 0.9; line-height: 1.6; }

        .btn-enter { margin-top: 30px; padding: 12px 30px; border-radius: 30px; background: white; font-weight: bold; border: none; font-size: 16px; transition: 0.3s; box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
        .student-card .btn-enter { color: #3498db; }
        .client-card .btn-enter { color: #e74c3c; }
        .role-card:hover .btn-enter { transform: scale(1.05); box-shadow: 0 10px 20px rgba(0,0,0,0.2); }

    </style>
</head>
<body>

<div class="container">
    <h1>E-Sağlık & Eğitim Platformu</h1>
    <p class="subtitle">Sisteme giriş yapmak için lütfen rolünüzü seçin.</p>

    <div class="split-container">
        <a href="{% url 'login' 'ogrenci' %}" class="role-card student-card">
            <div class="icon-circle">🎓</div>
            <h2>Öğrenci Girişi</h2>
            <p>Eğitimleri inceleyin, uzman profil detaylarına bakın ve görüşmelere katılın.</p>
            <button class="btn-enter">Sisteme Gir →</button>
        </a>

        <a href="{% url 'login' 'danisan' %}" class="role-card client-card">
            <div class="icon-circle">👤</div>
            <h2>Danışman Girişi</h2>
            <p>Randevularınızı yönetin, uzmanlarla mesajlaşın ve tahlil sonuçlarınızı yükleyin.</p>
            <button class="btn-enter">Sisteme Gir →</button>
        </a>
    </div>
</div>

</body>
</html>

<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>E-Sağlık Platformu | Hoş Geldiniz</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; color: white; font-family: 'Segoe UI', sans-serif; }
        .role-card { background: rgba(255, 255, 255, 0.1); backdrop-filter: blur(10px); padding: 40px; border-radius: 20px; border: 1px solid rgba(255, 255, 255, 0.2); width: 320px; transition: 0.3s; text-decoration: none; color: white; text-align: center; }
        .role-card:hover { transform: translateY(-10px); background: rgba(255, 255, 255, 0.2); border-color: #4facfe; }
        .btn-select { background: white; color: #1e3c72; padding: 10px 20px; border-radius: 25px; font-weight: bold; margin-top: 20px; border: none; }
    </style>
</head>
<body>
<div class="container">
    <div class="text-center mb-5">
        <h1 class="display-4 fw-bold">E-Sağlık & Danışmanlık</h1>
        <p class="lead">Lütfen devam etmek için rolünüzü seçiniz.</p>
    </div>
    <div class="d-flex justify-content-center gap-4">
        <a href="{% url 'login_sayfasi' 'ogrenci' %}" class="role-card">
            <div style="font-size: 50px;">🎓</div>
            <h2 class="mt-3">Öğrenci</h2>
            <p class="small opacity-75">Uzmanlardan randevu alın ve eğitimlere katılın.</p>
            <div class="btn-select">Öğrenci Girişi</div>
        </a>
        <a href="{% url 'login_sayfasi' 'uzman' %}" class="role-card">
            <div style="font-size: 50px;">💼</div>
            <h2 class="mt-3">Danışman</h2>
            <p class="small opacity-75">Danışanlarınızla görüşün ve randevuları yönetin.</p>
            <div class="btn-select">Uzman Girişi</div>
        </a>
    </div>
</div>
</body>
</html>

<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>{{ rol|title }} Kayıt Paneli</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; font-family: 'Segoe UI', sans-serif; padding: 20px; }
        .register-card { background: white; border-radius: 20px; padding: 35px; box-shadow: 0 15px 35px rgba(0,0,0,0.2); width: 100%; max-width: 500px; }
        .btn-register { background: #764ba2; color: white; border: none; padding: 12px; font-weight: bold; border-radius: 12px; width: 100%; transition: 0.3s; }
        .btn-register:hover { background: #5a377d; transform: translateY(-2px); }
        .form-control, .form-select { border-radius: 10px; padding: 10px; border: 1px solid #e1e8ef; }
        .error-msg { background-color: #ffeef0; color: #d73a49; padding: 10px; border-radius: 10px; border-left: 5px solid #d73a49; font-size: 14px; margin-bottom: 20px; }
    </style>
</head>
<body>
<div class="register-card">
    <h3 class="text-center fw-bold mb-4">{% if rol == 'ogrenci' %}ÖĞRENCİ{% else %}UZMAN{% endif %} KAYIT PANELİ</h3>

    {% if hata %}
    <div class="error-msg">
        <strong>⚠️ Hata:</strong> {{ hata }}
    </div>
    {% endif %}

    <form method="POST">
        {% csrf_token %}
        <div class="row g-3 mb-3">
            <div class="col-6 text-start">
                <label class="form-label small fw-bold">Ad</label>
                <input type="text" name="ad" class="form-control" required>
            </div>
            <div class="col-6 text-start">
                <label class="form-label small fw-bold">Soyad</label>
                <input type="text" name="soyad" class="form-control" required>
            </div>
        </div>

        <div class="mb-3 text-start">
            <label class="form-label small fw-bold">Kullanıcı Adı</label>
            <input type="text" name="u_name" class="form-control" placeholder="Örn: cemre123" required>
        </div>

        <div class="mb-3 text-start">
            <label class="form-label small fw-bold">E-Posta</label>
            <input type="email" name="email" class="form-control" required>
        </div>

        {% if rol == 'uzman' %}
        <div class="mb-3 text-start">
            <label class="form-label small fw-bold">Uzmanlık Alanı</label>
            <select name="brans" class="form-select" required>
                <option value="psikolog">Psikolog</option>
                <option value="diyetisyen">Diyetisyen</option>
                <option value="fizyoterapi">Fizyoterapist</option>
            </select>
        </div>
        <div class="mb-3 text-start">
            <label class="form-label small fw-bold">Uzmanlık Kayıt Anahtarı</label>
            <input type="password" name="uzman_anahtar" class="form-control" placeholder="Size verilen gizli kodu girin" required>
        </div>
        {% endif %}

        <div class="mb-4 text-start">
            <label class="form-label small fw-bold">Şifre</label>
            <input type="password" name="sifre" class="form-control" required>
        </div>

        <button type="submit" class="btn btn-register mb-3">Hesabımı Oluştur</button>

        <div class="text-center">
            <a href="{% url 'login_sayfasi' rol %}" class="text-muted small text-decoration-none">Zaten hesabım var</a>
        </div>
    </form>
</div>
</body>
</html>

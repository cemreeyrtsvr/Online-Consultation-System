<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Güvenli Ödeme | E-Sağlık Elite</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body {
            margin: 0; font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh; display: flex; align-items: center; justify-content: center;
        }
        .payment-card {
            background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(20px);
            width: 100%; max-width: 450px; padding: 40px; border-radius: 30px;
            box-shadow: 0 30px 60px rgba(0,0,0,0.1); text-align: center;
        }
        .summary-box {
            background: #f8fafc; padding: 20px; border-radius: 20px; margin: 25px 0;
            border: 1px dashed #3498db; text-align: left;
        }
        .input-group { text-align: left; margin-bottom: 15px; }
        label { display: block; font-size: 12px; font-weight: 700; color: #64748b; margin-bottom: 5px; }
        input {
            width: 100%; padding: 15px; border-radius: 12px; border: 2px solid #edf2f7;
            box-sizing: border-box; outline: none; transition: 0.3s;
        }
        input:focus { border-color: #3498db; }
        .btn-complete {
            background: #2ecc71; color: white; border: none; width: 100%; padding: 18px;
            border-radius: 15px; font-size: 17px; font-weight: 800; cursor: pointer;
            box-shadow: 0 10px 20px rgba(46,204,113,0.3);
            transition: 0.3s;
        }
        .btn-complete:hover {
            transform: translateY(-2px);
            background: #27ae60;
        }
    </style>
</head>
<body>
    <div class="payment-card">
        <i class="fas fa-shield-alt" style="font-size: 40px; color: #3498db; margin-bottom: 15px;"></i>
        <h2 style="margin:0;">Ödeme Detayları</h2>

        <div class="summary-box">
            <small style="color:#3498db; font-weight:800;">RANDEVU ÖZETİ</small>
            <div style="margin-top:10px;">
                <b>{{ saat.uzman.unvan }} {{ saat.uzman.ad_soyad }}</b><br>
                <span><i class="far fa-calendar"></i> {{ saat.gun|date:"d F Y" }}</span><br>
                <span><i class="far fa-clock"></i> {{ saat.saat|time:"H:i" }}</span>
            </div>
            <div style="margin-top:10px; border-top:1px solid #ddd; padding-top:10px; font-weight:900; color:#2ecc71; font-size:18px;">
                Toplam Tutar: {{ ucret }} TL
            </div>
        </div>

        <form method="POST">
            {% csrf_token %}
            <div class="input-group">
                <label>Kart Üzerindeki İsim</label>
                <input type="text" name="kart_isim" placeholder="AYŞE ZORLU" required>
            </div>
            <div class="input-group">
                <label>Kart Numarası</label>
                <input type="text" name="kart_no" placeholder="**** **** **** ****" required>
            </div>
            <div style="display:grid; grid-template-columns: 1fr 1fr; gap:10px;">
                <div class="input-group">
                    <label>Sona Erme</label>
                    <input type="text" name="son_tarih" placeholder="AA/YY" required>
                </div>
                <div class="input-group">
                    <label>CVV</label>
                    <input type="password" name="cvv" placeholder="***" required>
                </div>
            </div>
            <button type="submit" class="btn-complete">
                <i class="fas fa-lock"></i> {{ ucret }} TL Ödemeyi Tamamla
            </button>
            <a href="{% url 'ana_sayfa' %}" style="display:block; margin-top:15px; color:#94a3b8; text-decoration:none; font-size:13px; font-weight:600;">Vazgeç ve Dön</a>
        </form>
    </div>
</body>
</html>

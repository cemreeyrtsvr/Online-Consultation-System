<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Güvenli Ödeme</title>
    <style>
        body { margin: 0; font-family: 'Segoe UI', sans-serif; background: #f0f2f5; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
        .checkout-container { background: white; width: 100%; max-width: 800px; border-radius: 15px; box-shadow: 0 15px 40px rgba(0,0,0,0.1); display: flex; overflow: hidden; }

        /* Sol Taraf: Özet */
        .summary-side { background: #2c3e50; color: white; padding: 40px; width: 40%; display: flex; flex-direction: column; justify-content: space-between; }
        .summary-side h2 { margin-top: 0; color: #4facfe; }
        .detail-item { margin-bottom: 20px; }
        .detail-item span { display: block; font-size: 12px; color: #bdc3c7; text-transform: uppercase; letter-spacing: 1px; }
        .detail-item strong { font-size: 18px; }
        .total-price { font-size: 32px; font-weight: bold; border-top: 1px solid rgba(255,255,255,0.2); padding-top: 20px; margin-top: 20px; }

        /* Sağ Taraf: Kart Bilgileri */
        .payment-side { padding: 40px; width: 60%; background: #ffffff; }
        .payment-side h3 { margin-top: 0; color: #333; margin-bottom: 25px; }

        .input-group { margin-bottom: 20px; }
        .input-group label { display: block; font-size: 13px; color: #666; font-weight: bold; margin-bottom: 8px; }
        .input-group input { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 8px; font-size: 15px; box-sizing: border-box; outline: none; transition: 0.3s; }
        .input-group input:focus { border-color: #3498db; box-shadow: 0 0 5px rgba(52,152,219,0.3); }

        .row { display: flex; gap: 15px; }
        .row .input-group { flex: 1; }

        .btn-pay { width: 100%; padding: 16px; background: #27ae60; color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.3s; margin-top: 10px; }
        .btn-pay:hover { background: #219150; transform: translateY(-2px); box-shadow: 0 5px 15px rgba(39,174,96,0.4); }

        .back-btn { display: inline-block; margin-top: 20px; color: #95a5a6; text-decoration: none; font-size: 14px; }
        .back-btn:hover { color: #333; }
    </style>
</head>
<body>

<div class="checkout-container">
    <div class="summary-side">
        <div>
            <h2>Randevu Özeti</h2>
            <div class="detail-item">
                <span>Uzman</span>
                <strong>{{ doktor_adi }}</strong>
            </div>
            <div class="detail-item">
                <span>Tarih</span>
                <strong>{{ tarih }}</strong>
            </div>
            <div class="detail-item">
                <span>Saat</span>
                <strong>{{ saat }}</strong>
            </div>
        </div>
        <div class="total-price">
            {{ fiyat }}
        </div>
    </div>

    <div class="payment-side">
        <h3>Kart Bilgileri (Demo)</h3>
        <div class="input-group">
            <label>Kart Üzerindeki İsim</label>
            <input type="text" placeholder="Ad Soyad" value="Test Kullanıcısı">
        </div>
        <div class="input-group">
            <label>Kart Numarası</label>
            <input type="text" placeholder="0000 0000 0000 0000" value="4543 1234 5678 9012">
        </div>
        <div class="row">
            <div class="input-group">
                <label>Son Kullanma (AA/YY)</label>
                <input type="text" placeholder="12/26" value="12/28">
            </div>
            <div class="input-group">
                <label>CVV</label>
                <input type="text" placeholder="123" value="123">
            </div>
        </div>

        <button class="btn-pay" onclick="odemeTamamla()">Ödemeyi Tamamla ve Onayla</button>
        <a href="javascript:history.back()" class="back-btn">← Vazgeç ve Geri Dön</a>
    </div>
</div>

<script>
    function odemeTamamla() {
        // Demoda ödeme yapılmış gibi gösterip ana sayfaya atıyoruz
        alert("🎉 Ödemeniz başarıyla alındı!\nRandevunuz onaylanmıştır. Randevu saatinizde sisteme giriş yapmayı unutmayın.");
        window.location.href = "{% url 'ana_sayfa' %}";
    }
</script>

</body>
</html>

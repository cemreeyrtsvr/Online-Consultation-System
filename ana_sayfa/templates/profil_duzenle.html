<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Bilgilerimi Düzenle | E-Sağlık</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { background-color: #f0f4f8; font-family: 'Segoe UI', sans-serif; }
        .edit-container { max-width: 600px; margin: 50px auto; }
        .edit-card { background: white; border-radius: 20px; padding: 40px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); }
        .profile-pic-preview { width: 120px; height: 120px; border-radius: 50%; object-fit: cover; border: 4px solid #3498db; margin-bottom: 20px; }
        .btn-save { background: #3498db; color: white; border: none; padding: 12px; border-radius: 12px; width: 100%; font-weight: bold; transition: 0.3s; }
        .btn-save:hover { background: #2980b9; transform: translateY(-2px); }
    </style>
</head>
<body>

<div class="edit-container">
    <div class="edit-card">
        <h3 class="text-center fw-bold mb-4">Profil Bilgilerini Güncelle</h3>

        <form method="POST" enctype="multipart/form-data">
            {% csrf_token %}

            <div class="text-center mb-4">
                {% if profil.profil_resmi %}
                    <img src="{{ profil.profil_resmi.url }}" class="profile-pic-preview">
                {% else %}
                    <div class="profile-pic-preview d-inline-flex align-items-center justify-content: center; background: #eee; font-size: 40px; color: #aaa; line-height: 120px;">
                        <i class="fas fa-user"></i>
                    </div>
                {% endif %}
                <div class="mt-2">
                    <label class="form-label small fw-bold">Profil Fotoğrafı Seç</label>
                    <input type="file" name="profil_foto" class="form-control">
                </div>
            </div>

            <div class="row g-3 mb-3">
                <div class="col-6">
                    <label class="form-label small fw-bold">Ad</label>
                    <input type="text" name="ad" class="form-control" value="{{ user.first_name }}" required>
                </div>
                <div class="col-6">
                    <label class="form-label small fw-bold">Soyad</label>
                    <input type="text" name="soyad" class="form-control" value="{{ user.last_name }}" required>
                </div>
            </div>

            <div class="mb-3">
                <label class="form-label small fw-bold">E-Posta</label>
                <input type="email" name="email" class="form-control" value="{{ user.email }}" required>
            </div>

            {% if not user.uzman %}
            <div class="mb-3">
                <label class="form-label small fw-bold">Telefon</label>
                <input type="text" name="telefon" class="form-control" value="{{ profil.telefon|default:'' }}">
            </div>
            {% endif %}

            <div class="mb-4">
                <label class="form-label small fw-bold">Yeni Şifre (Değiştirmeyecekseniz boş bırakın)</label>
                <input type="password" name="sifre" class="form-control" placeholder="••••••••">
            </div>

            <div class="d-flex gap-2">
                <button type="submit" class="btn btn-save">Değişiklikleri Kaydet</button>
                <a href="{% url 'profil_sayfasi' %}" class="btn btn-light w-100" style="border-radius:12px; padding:12px;">Vazgeç</a>
            </div>
        </form>
    </div>
</div>

</body>
</html>

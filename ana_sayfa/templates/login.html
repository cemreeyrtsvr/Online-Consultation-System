<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>{{ rol_gosterimi }} Girişi</title>
    <style>
        body {
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            /* FOTOĞRAFSIZ, CANLI MAVİ GRADYAN ARKA PLAN */
            background: linear-gradient(135deg, #0f2027 0%, #203a43 50%, #2c5364 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        .login-container {
            background: #ffffff;
            padding: 50px 40px;
            border-radius: 20px;
            /* Gölgeyi koyu arka plana göre ayarladım */
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 360px;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        /* Üstteki renkli şerit */
        .login-container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 6px;
            background: linear-gradient(90deg, #4facfe, #00f2fe);
        }

        .icon-wrapper {
            width: 70px;
            height: 70px;
            background: #f0f4f8;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 30px;
            margin: 0 auto 20px auto;
            box-shadow: 0 8px 16px rgba(0,0,0,0.1);
        }

        h2 {
            color: #2c3e50;
            margin: 0 0 30px 0;
            font-size: 24px;
            font-weight: 700;
        }

        .input-group {
            margin-bottom: 20px;
            text-align: left;
        }

        .input-group label {
            display: block;
            margin-bottom: 8px;
            color: #5c6a79;
            font-weight: 600;
            font-size: 13px;
            letter-spacing: 0.5px;
        }

        .input-group input {
            width: 100%;
            padding: 14px 15px;
            border: 2px solid #e1e8ef;
            border-radius: 10px;
            box-sizing: border-box;
            font-size: 14px;
            outline: none;
            transition: all 0.3s ease;
            background: #f8fafc;
            color: #2c3e50;
        }

        .input-group input:focus {
            border-color: #4facfe;
            background: #ffffff;
            box-shadow: 0 0 0 4px rgba(79, 172, 254, 0.1);
        }

        .btn-submit {
            width: 100%;
            padding: 16px;
            /* Buton rengini de arka planla uyumlu canlı bir mavi yaptım */
            background: linear-gradient(90deg, #4facfe, #00f2fe);
            color: white;
            border: none;
            border-radius: 10px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 15px;
            box-shadow: 0 10px 20px rgba(79, 172, 254, 0.3);
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 30px rgba(79, 172, 254, 0.4);
        }

        .back-link {
            display: inline-block;
            margin-top: 25px;
            color: #95a5a6;
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            transition: 0.2s;
        }

        .back-link:hover {
            color: #4facfe;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="icon-wrapper">
            {% if rol == 'ogrenci' %}🎓{% else %}👤{% endif %}
        </div>

        <h2>{{ rol_gosterimi }} Girişi</h2>

        <form method="POST">
            {% csrf_token %}
            <div class="input-group">
                <label>Adınız</label>
                <input type="text" name="ad" required placeholder="Adınızı girin">
            </div>
            <div class="input-group">
                <label>Soyadınız</label>
                <input type="text" name="soyad" required placeholder="Soyadınızı girin">
            </div>
            <div class="input-group">
                <label>Şifre</label>
                <input type="password" name="sifre" required placeholder="••••••••">
            </div>
            <button type="submit" class="btn-submit">Sisteme Giriş Yap</button>
        </form>

        <a href="{% url 'giris' %}" class="back-link">← Rol Seçimine Dön</a>
    </div>
</body>
</html>

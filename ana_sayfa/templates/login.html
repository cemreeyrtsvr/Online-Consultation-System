<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>{{ rol_gosterimi }} Girişi</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; font-family: 'Segoe UI', sans-serif; }
        .login-card { background: white; border-radius: 20px; padding: 40px; box-shadow: 0 15px 35px rgba(0,0,0,0.2); width: 100%; max-width: 400px; }
        .btn-primary { background: linear-gradient(to right, #4facfe 0%, #00f2fe 100%); border: none; padding: 12px; font-weight: bold; border-radius: 12px; transition: 0.3s; }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(79, 172, 254, 0.4); }
        .form-control { border-radius: 10px; padding: 12px; border: 1px solid #e1e8ef; }
    </style>
</head>
<body>
<div class="login-card text-center">
    <div style="font-size: 50px; margin-bottom: 20px;">{% if rol == 'ogrenci' %}🎓{% else %}👤{% endif %}</div>
    <h3 class="fw-bold mb-4">{{ rol_gosterimi }} Girişi</h3>

    <form method="POST">
        {% csrf_token %}
        <div class="mb-3 text-start">
            <label class="form-label small fw-bold">Kullanıcı Adı</label>
            <input type="text" name="username" class="form-control" placeholder="Kullanıcı adınızı girin" required>
        </div>
        <div class="mb-4 text-start">
            <label class="form-label small fw-bold">Şifre</label>
            <input type="password" name="password" class="form-control" placeholder="••••••••" required>
        </div>
        <button type="submit" class="btn btn-primary w-100 mb-3">Sisteme Giriş Yap</button>

        <div class="small">
            <p class="text-muted">Hesabınız yok mu? <a href="{% url 'kayit_ol' rol %}" class="text-primary text-decoration-none fw-bold">Kayıt Olun</a></p>
            <a href="{% url 'giris_sayfasi' %}" class="text-muted text-decoration-none">← Rol Seçimine Dön</a>
        </div>
    </form>
</div>
</body>
</html>
